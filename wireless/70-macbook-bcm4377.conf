# Local workaround for the BCM4377 D3 timeout on MacBookPro15,4.
# systemd invokes ExecStopPost even when preparation or suspend fails.
[Service]
RuntimeDirectory=macbook-bcm4377-suspend
RuntimeDirectoryMode=0700
ExecStartPre=:/bin/sh -ec '\
    grep -Fxq MacBookPro15,4 /sys/class/dmi/id/product_name || exit 0; \
    [ -d /sys/module/t2bce_core ] || exit 0; \
    device=/sys/bus/pci/devices/0000:01:00.0; \
    [ -L /sys/bus/pci/drivers/brcmfmac/0000:01:00.0 ] || exit 0; \
    grep -Fxq 0x14e4 "$device/vendor" && grep -Fxq 0x4488 "$device/device" || exit 0; \
    touch /run/macbook-bcm4377-suspend/wifi; \
    if [ -d /sys/module/brcmfmac_wcc ]; then \
        touch /run/macbook-bcm4377-suspend/wcc; \
        /usr/sbin/rmmod brcmfmac_wcc; \
    fi; \
    /usr/sbin/rmmod brcmfmac; \
    echo "BCM4377 Wi-Fi driver unloaded for suspend"'
ExecStopPost=:/bin/sh -ec '\
    [ -f /run/macbook-bcm4377-suspend/wifi ] || exit 0; \
    /usr/sbin/modprobe brcmfmac; \
    if [ -f /run/macbook-bcm4377-suspend/wcc ]; then \
        /usr/sbin/modprobe brcmfmac_wcc; \
    fi; \
    echo "BCM4377 Wi-Fi driver restored after suspend attempt"'
