# Prefer the newest installed Resolute T2 kernel with a boot image and initramfs.
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=8
GRUB_DEFAULT=0
GRUB_TOP_LEVEL=$(
    for t2_image in /boot/vmlinuz-*-t2-resolute; do
        [ -f "$t2_image" ] || continue
        [ -s "/boot/initrd.img-${t2_image#/boot/vmlinuz-}" ] || continue
        printf '%s\n' "$t2_image"
    done | LC_ALL=C sort -V | tail -n 1
)
